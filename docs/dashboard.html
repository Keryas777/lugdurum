<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#a88f68" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lugdurum" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="./assets/icons/icon-180.png" />
    <title>Lugdurum — Dashboard</title>
    <link rel="stylesheet" href="./style.css?v=14" />
    <link rel="stylesheet" href="./dashboard.css?v=1" />
    <script src="./lugdurum-api.js?v=5" defer></script>
    <script src="./dashboard.js?v=1" defer></script>
    <script src="./pwa.js?v=6" defer></script>
  </head>

  <body class="page-dashboard">
    <div class="appShell dashboardShell">
      <header class="topbar dashboardTopbar">
        <a class="backBtn" href="./index.html" aria-label="Retour au tableau de bord">←</a>
        <div class="brandBlock">
          <div class="brandHeader">
            <img class="brandLogo" src="./assets/icons/icon-180.png" alt="Logo Lugdurum" />
            <div class="brandText">
              <p class="brandName">LUGDURUM</p>
              <h1>Dashboard</h1>
            </div>
          </div>
        </div>
      </header>

      <main class="dashboardLayout">
        <section class="dashboardHero">
          <div>
            <p class="sectionKicker">Pilotage</p>
            <h2>Vue d’ensemble</h2>
            <p class="dashboardHeroText">Résumé simple à partir des données déjà disponibles.</p>
          </div>
          <div class="dashboardStats"><article class="dashboardStatCard"><span>CA enregistré</span><strong id="dashboardRevenue">—</strong></article>
            <article class="dashboardStatCard"><span>Frais</span><strong id="dashboardExpenses">—</strong></article></div>
        </section>
        <section class="dashboardPanel">
          <div class="sectionHeader compact">
            <div>
              <p class="sectionKicker">Indicateurs</p>
              <h2>Terrain</h2>
            </div>
          </div>
          <div class="dashboardList" id="dashboardList">
            <p class="dashboardEmpty">Chargement des indicateurs…</p>
          </div>
          <p class="dashboardStatus" id="dashboardStatus" role="status"></p>
        </section>
      </main>
    </div>
  </body>
</html>
