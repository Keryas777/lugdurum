<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#a88f68" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lugdurum" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="./assets/icons/icon-180.png" />
    <title>Lugdurum — Revenus</title>
    <link rel="stylesheet" href="./style.css?v=14" />
    <link rel="stylesheet" href="./revenus.css?v=1" />
    <script src="./lugdurum-api.js?v=5" defer></script>
    <script src="./revenus.js?v=1" defer></script>
    <script src="./pwa.js?v=6" defer></script>
  </head>

  <body class="page-revenus">
    <div class="appShell revenusShell">
      <header class="topbar revenusTopbar">
        <a class="backBtn" href="./index.html" aria-label="Retour au tableau de bord">←</a>
        <div class="brandBlock">
          <div class="brandHeader">
            <img class="brandLogo" src="./assets/icons/icon-180.png" alt="Logo Lugdurum" />
            <div class="brandText">
              <p class="brandName">LUGDURUM</p>
              <h1>Revenus</h1>
            </div>
          </div>
        </div>
      </header>

      <main class="revenusLayout">
        <section class="revenusHero">
          <div>
            <p class="sectionKicker">Hors terrain</p>
            <h2>Autres entrées d’argent</h2>
            <p class="revenusHeroText">Pros, commandes directes, animations et revenus hors salons.</p>
          </div>
          <div class="revenusStats"><article class="revenusStatCard"><span>Total revenus</span><strong id="revenuesTotal">—</strong></article>
            <article class="revenusStatCard"><span>Nombre</span><strong id="revenuesCount">—</strong></article></div>
        </section>
        <section class="revenusPanel">
          <div class="sectionHeader compact">
            <div>
              <p class="sectionKicker">Saisie</p>
              <h2 id="revenueFormTitle">Ajouter un revenu</h2>
            </div>
            <button class="smallTextBtn" type="button" id="resetRevenueBtn">Réinitialiser</button>
          </div>

          <form class="revenusForm" id="revenueForm">
            <input id="revenueIdInput" type="hidden" />
            <div class="formGrid">
              <label class="fieldBlock"><span>Date</span><input id="revenueDateInput" type="date" required /></label>
              <label class="fieldBlock"><span>Canal</span><select id="revenueChannelInput" required><option value="PRO">Pro</option><option value="COMMANDE_DIRECTE">Commande directe</option><option value="ANIMATION">Animation</option><option value="SITE_WEB">Site web</option><option value="AUTRE">Autre</option></select></label>
              <label class="fieldBlock"><span>Client / source</span><input id="revenueClientInput" type="text" placeholder="Ex : Cave, client direct…" /></label>
              <label class="fieldBlock"><span>Montant</span><input id="revenueAmountInput" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0,00" required /></label>
              <label class="fieldBlock"><span>Mode</span><select id="revenuePaymentInput"><option value="VIR">Virement</option><option value="CB">CB</option><option value="ESP">Espèces</option><option value="CHQ">Chèque</option><option value="AUTRE">Autre</option></select></label>
              <label class="fieldBlock"><span>Statut</span><select id="revenueStatusInput"><option value="encaisse">Encaissé</option><option value="attente">En attente</option><option value="annule">Annulé</option></select></label>
            </div>
            <label class="fieldBlock"><span>Note</span><textarea id="revenueNoteInput" rows="3" placeholder="Détail de commande, référence, commentaire…"></textarea></label>
            <div class="revenusActions">
              <button class="btn btnGhost" type="button" id="cancelRevenueEditBtn" hidden>Annuler modification</button>
              <button class="btn btnPrimary" type="submit" id="saveRevenueBtn">Enregistrer le revenu</button>
            </div>
            <p class="revenusStatus" id="revenueStatus" role="status"></p>
          </form>
        </section>

        <section class="revenusPanel">
          <div class="sectionHeader compact">
            <div>
              <p class="sectionKicker">Historique</p>
              <h2>Revenus saisis</h2>
            </div>
          </div>
          <div class="revenusList" id="revenuesList">
            <p class="revenusEmpty">Aucun revenu saisi.</p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
