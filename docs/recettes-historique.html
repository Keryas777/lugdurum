<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f1e8" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/icons/icon-180.png" />
    <title>Historique recettes — Lugdurum</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./recettes-historique.css" />
  </head>

  <body>
    <main class="appShell">
      <header class="topbar">
        <a class="backBtn" href="./recettes-dashboard.html" aria-label="Retour au module recettes">
          ←
        </a>

        <div class="brandBlock">
          <div class="brandHeader">
            <img
              class="brandLogo"
              src="./assets/icons/icon-180.png"
              alt="Logo Lugdurum"
            />

            <div class="brandText">
              <p class="brandName">LUGDURUM</p>
              <h1>Historique recettes</h1>
            </div>
          </div>
        </div>
      </header>

      <div class="moduleNavSpacer" aria-hidden="true"></div>

      <section class="hero">
        <h2>Repartir d’une bonne version</h2>
        <p>
          Filtre les recettes par parfum, année ou statut, puis ouvre le détail
          pour dupliquer ou lancer une nouvelle cuvée.
        </p>

        <div class="filters">
          <input id="searchInput" type="search" placeholder="Parfum, note, ingrédient…" />

          <select id="yearFilter">
            <option value="">Toutes années</option>
          </select>

          <select id="statusFilter">
            <option value="">Tous statuts</option>
            <option value="favorite">Favorites</option>
            <option value="active">Actives</option>
            <option value="archivee">Archivées</option>
            <option value="test">Tests</option>
          </select>
        </div>
      </section>

      <section class="grid two">
        <div class="panel">
          <h2>Recettes</h2>
          <div id="recipesList" class="list"></div>
        </div>

        <aside class="panel" id="recipeDetail">
          <h2>Détail</h2>
          <div class="empty">
            Sélectionne une recette pour voir ses ratios, notes et cuvées liées.
          </div>
        </aside>
      </section>
    </main>

    <script src="./lugdurum-api.js?v=15" defer></script>
    <script src="./recettes-historique.js" defer></script>
  </body>
</html>
