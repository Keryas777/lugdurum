<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#a88f68" />

    <link rel="manifest" href="./manifest.webmanifest" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lugdurum" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" href="./assets/icons/icon-180.png" />

    <title>Lugdurum — Évènements</title>

    <link rel="stylesheet" href="./style.css?v=11" />
    <link rel="stylesheet" href="./missions.css?v=3" />

    <script src="./missions.js?v=3" defer></script>
    <script src="./pwa.js?v=6" defer></script>
  </head>

  <body class="page-missions">
    <div class="appShell missionsShell">
      <header class="topbar missionsTopbar">
        <a class="backBtn" href="./index.html" aria-label="Retour au tableau de bord">
          ←
        </a>

        <div class="brandBlock">
          <div class="brandHeader">
            <img
              class="brandLogo"
              src="./assets/icons/icon-180.png"
              alt="Logo Lugdurum"
            />

            <div class="brandText">
              <p class="brandName">LUGDURUM</p>
              <h1>Évènements</h1>
            </div>
          </div>
        </div>
      </header>

      <main class="missionsLayout">
        <section class="missionHero" aria-labelledby="missionHeroTitle">
          <h2 id="missionHeroTitle">Préparation d’un évènement</h2>
        </section>

        <section class="missionPanel" aria-labelledby="upcomingMissionsTitle">
          <div class="sectionHeader compact">
            <div>
              <h2 id="upcomingMissionsTitle">Évènements à venir</h2>
            </div>
          </div>

          <div class="missionsList" id="missionsList">
            <p class="missionEmpty">Aucun évènement enregistré pour l’instant.</p>
          </div>
        </section>

        <section class="missionPanel missionWizard" aria-labelledby="createMissionTitle">
          <div class="sectionHeader compact">
            <div>
              <h2 id="createMissionTitle">Créer un évènement</h2>
            </div>
          </div>

          <form id="missionForm" class="missionForm">
            <div class="eventTypeGrid" role="group" aria-label="Durée de l’évènement">
              <button
                class="eventTypeCard isActive"
                type="button"
                data-event-mode="single"
                aria-pressed="true"
              >
                <span class="eventTypeIcon" aria-hidden="true">☀️</span>
                <strong>Journée unique</strong>
                <small>Un marché ou salon sur une journée.</small>
              </button>

              <button
                class="eventTypeCard"
                type="button"
                data-event-mode="multi"
                aria-pressed="false"
              >
                <span class="eventTypeIcon" aria-hidden="true">📆</span>
                <strong>Plusieurs jours</strong>
                <small>Mission avec J1, J2, J3…</small>
              </button>
            </div>

            <div class="missionFields">
              <label class="missionField missionFieldFull">
                <span>Nom de l’évènement</span>
                <input
                  id="missionNameInput"
                  type="text"
                  autocomplete="off"
                  placeholder="Ex : Marché de Noël Lozanne"
                  required
                />
              </label>

              <label class="missionField">
                <span>Type</span>
                <select id="eventKindInput">
                  <option value="MARCHE_ARTISANAL">Marché artisanal</option>
                  <option value="SALON_DES_VINS">Salon des vins</option>
                  <option value="MARCHE_DE_NOEL">Marché de Noël</option>
                  <option value="FOIRE">Foire</option>
                  <option value="AUTRE">Autre</option>
                </select>
              </label>

              <label class="missionField">
                <span>Ville</span>
                <input
                  id="cityInput"
                  type="text"
                  autocomplete="off"
                  placeholder="Ex : Lozanne"
                />
              </label>

              <label class="missionField missionFieldFull">
                <span>Lieu</span>
                <input
                  id="locationInput"
                  type="text"
                  autocomplete="off"
                  placeholder="Ex : Salle des fêtes, place du marché..."
                />
              </label>

              <label class="missionField">
                <span id="startDateLabel">Date</span>
                <input id="startDateInput" type="date" required />
              </label>

              <label class="missionField" id="endDateField" hidden>
                <span>Date de fin</span>
                <input id="endDateInput" type="date" />
              </label>

              <div class="missionField missionFieldFull">
                <span>Qui fait l’évènement ?</span>

                <div class="operatorGrid" role="group" aria-label="Vendeurs prévus">
                  <button
                    class="operatorChip isActive"
                    type="button"
                    data-operator="U_JEROME"
                    aria-pressed="true"
                  >
                    Jérôme
                  </button>

                  <button
                    class="operatorChip"
                    type="button"
                    data-operator="U_ANTHO"
                    aria-pressed="false"
                  >
                    Antho
                  </button>

                  <button
                    class="operatorChip"
                    type="button"
                    data-operator="U_WILL"
                    aria-pressed="false"
                  >
                    Will
                  </button>

                  <button
                    class="operatorChip"
                    type="button"
                    data-operator="AUTRE"
                    aria-pressed="false"
                  >
                    Autre
                  </button>
                </div>
              </div>

              <label class="missionField missionFieldFull" id="otherOperatorField" hidden>
                <span>Nom de l’autre personne</span>
                <input
                  id="otherOperatorInput"
                  type="text"
                  autocomplete="off"
                  placeholder="Ex : William, famille, renfort..."
                />
              </label>

              <label class="missionField missionFieldFull">
                <span>Note</span>
                <textarea
                  id="noteInput"
                  rows="3"
                  placeholder="Optionnel : horaires, emplacement, inscription, infos pratiques..."
                ></textarea>
              </label>
            </div>

            <div class="dayPreviewBox" aria-live="polite">
              <div class="sectionHeader compact">
                <div>
                  <p class="sectionKicker">Aperçu</p>
                  <h2>Journées créées</h2>
                </div>
              </div>

              <div class="dayPreviewList" id="dayPreviewList">
                <p class="missionEmpty">Choisis une date pour générer J1.</p>
              </div>
            </div>

            <div class="missionActions">
              <button class="btn btnGhost" type="button" id="resetMissionBtn">
                Réinitialiser
              </button>

              <button
                class="btn btnGhost"
                type="submit"
                data-submit-action="save"
              >
                Enregistrer
              </button>

              <button
                class="btn btnPrimary"
                type="submit"
                data-submit-action="prepare"
              >
                Enregistrer et préparer le stock
              </button>
            </div>

            <p class="missionStatus" id="missionStatus" role="status"></p>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
