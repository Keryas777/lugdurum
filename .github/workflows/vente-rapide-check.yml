name: Verification vente rapide

on:
  pull_request:
    paths:
      - "docs/vente-rapide.js"
      - "docs/vente-rapide.html"
      - "docs/lugdurum-api.js"
      - "docs/journees-cloturees.js"
      - "docs/diagnostic-sync.js"
      - "tests/journees-cloturees.test.cjs"
      - "apps-script/01_http_router.js"
      - "apps-script/10_sumup_verification.gs"
      - "tests/sumup-verification.test.cjs"
      - "tests/vente-rapide.test.cjs"
      - "tests/stock-report.test.cjs"
      - ".github/workflows/vente-rapide-check.yml"
  push:
    branches:
      - audit-gerzat-vente-rapide-v20
      - feature/sumup-verification-pilot
    paths:
      - "docs/vente-rapide.js"
      - "docs/vente-rapide.html"
      - "docs/lugdurum-api.js"
      - "docs/journees-cloturees.js"
      - "docs/diagnostic-sync.js"
      - "tests/journees-cloturees.test.cjs"
      - "apps-script/01_http_router.js"
      - "apps-script/10_sumup_verification.gs"
      - "tests/sumup-verification.test.cjs"
      - "tests/vente-rapide.test.cjs"
      - "tests/stock-report.test.cjs"
      - ".github/workflows/vente-rapide-check.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verifier la syntaxe
        run: |
          node --check docs/vente-rapide.js
          node --check docs/lugdurum-api.js
          node --check docs/journees-cloturees.js
          node --check docs/diagnostic-sync.js
      - name: Tester la vente rapide en simulation
        run: node --test tests/vente-rapide.test.cjs
      - name: Tester le report de stock Gerzat J2
        run: node --test tests/stock-report.test.cjs
      - name: Tester les journées clôturées et quotas Safari (simulation)
        run: node --test tests/journees-cloturees.test.cjs
      - name: Tester le routeur et la verification SumUp (simulation)
        run: node --test tests/sumup-verification.test.cjs
