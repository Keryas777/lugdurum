name: Connexion Google Apps Script

on:
  push:
    branches:
      - chore/import-apps-script
    paths:
      - ".github/workflows/apps-script-connection.yml"

permissions:
  contents: read

jobs:
  verifier-connexion:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Installer clasp
        run: npm install -g @google/clasp@3.4.1

      - name: Configurer les identifiants Google
        env:
          CLASP_CREDENTIALS_JSON: ${{ secrets.CLASP_CREDENTIALS_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          test -n "$CLASP_CREDENTIALS_JSON"
          test -n "$APPS_SCRIPT_ID"

          printf '%s' "$CLASP_CREDENTIALS_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

          node -e '
            const fs = require("fs");
            fs.writeFileSync(".clasp.json", JSON.stringify({
              scriptId: process.env.APPS_SCRIPT_ID,
              rootDir: "apps-script"
            }));
          '

      - name: Verifier l'acces en lecture seule
        run: |
          clasp deployments > /dev/null
          echo "Connexion Google Apps Script reussie"
